# Global settings
defaults:
  timeout_seconds: 60
  max_retries: 3
  retry_delay_seconds: 2
  circuit_breaker_threshold: 3
  circuit_breaker_timeout: 60
  health_check_interval: 30

# vLLM deployment ports mapping (for docker-compose)
vllm_ports:
  brain_qwen3_235b: 8001
  ops_agentworld_35b: 8002
  ops_qwen3_30b: 8003
  devops_coder_32b: 8004
  devops_coder_2_5_32b: 8005
  research_thinking_30b: 8006
  finance_qwen3_32b: 8007
  marketing_qwen3_32b: 8008
  sales_qwen3_32b: 8009
  product_qwen3_30b: 8010
  hr_qwen3_14b: 8011
  workers_qwen3_14b: 8012
  workers_mixtral_8x22b: 8013