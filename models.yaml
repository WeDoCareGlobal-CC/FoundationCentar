# FoundationCentar — Model Registry for Multi-Agent Orchestration
# Maps each Chief/Worker role to primary + fallback model endpoints (OpenAI-compatible)

brain:
  primary:
    provider: "nvidia_nim"
    model: "nvidia/nemotron-3-ultra-550b-a55b"
    base_url: "https://integrate.api.nvidia.com/v1"
    api_key_env: "NVIDIA_API_KEY"
    capabilities: ["reasoning", "planning", "routing", "function_calling"]
    max_tokens: 4096
    temperature: 0.1
  fallbacks:
    - provider: "nvidia_nim"
      model: "nvidia/nemotron-3-super-120b-a12b"
      base_url: "https://integrate.api.nvidia.com/v1"
      api_key_env: "NVIDIA_API_KEY"
    - provider: "nvidia_nim"
      model: "nvidia/llama-3.1-nemotron-70b-instruct"
      base_url: "https://integrate.api.nvidia.com/v1"
      api_key_env: "NVIDIA_API_KEY"
    - provider: "vllm"
      model: "Qwen/Qwen3-235B-A22B"
      base_url: "http://localhost:8001/v1"
      api_key_env: "VLLM_API_KEY"

chiefs:
  operations:
    primary:
      provider: "vllm"
      model: "Qwen/Qwen-AgentWorld-35B-A3B"
      base_url: "http://localhost:8002/v1"
      api_key_env: "VLLM_API_KEY"
      capabilities: ["os", "terminal", "swe", "mcp", "search", "android", "web"]
      max_tokens: 8192
      temperature: 0.2
    fallbacks:
      - provider: "vllm"
        model: "Qwen/Qwen3-30B-A3B-Instruct"
