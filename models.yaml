    fallbacks:
      - provider: "vllm"
        model: "Qwen/Qwen2.5-Coder-32B-Instruct"
        base_url: "http://localhost:8005/v1"
        api_key_env: "VLLM_API_KEY"
      - provider: "nvidia_nim"
